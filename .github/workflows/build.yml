name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android project banao
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          flutter create --platforms=android --project-name countryball_maker --org com.countryball .
      - name: AdMob aur permissions set karo
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' $M
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: countryball-apk
          path: build/app/outputs/flutter-apk/app-release.apk
